<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Talk Board</title>
<meta name="description" content="A picture-based talking app (AAC) for children who are not speaking yet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Talk Board">
<meta name="theme-color" content="#1F8A9C">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #EEF1F5;
    --panel: #FFFFFF;
    --ink: #1D2430;
    --muted: #5E6B7D;
    --line: #D5DBE4;
    --accent: #1F8A9C;
    --accent-ink: #FFFFFF;
    --danger: #D64545;
    --gap: 8px;
    --radius: 16px;
    --label-size: 20px;

    /* Fitzgerald-style word colours used by most AAC systems */
    --c-people: #FFE27A;
    --c-action: #9BE09B;
    --c-describe: #A3CDFF;
    --c-thing: #FFC48A;
    --c-social: #FFB3D1;
    --c-question: #D5BCFF;
    --c-no: #FF9E9E;
    --c-little: #FFFFFF;
    --c-folder: #EADFCB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  input, select, textarea { font: inherit; -webkit-user-select: text; user-select: text; }

  /* ---------- Top: message bar ---------- */
  #top { display: flex; gap: var(--gap); padding: 10px 10px 0; align-items: stretch; }
  .navbtn, .barbtn {
    border: 0; border-radius: var(--radius); background: var(--panel);
    min-width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 15px; font-weight: 600; box-shadow: 0 1px 0 var(--line), 0 2px 6px rgba(0,0,0,.05);
  }
  .navbtn .ico, .barbtn .ico { font-size: 30px; line-height: 1; }
  .navbtn:disabled { opacity: .35; }
  #speakBtn { background: var(--accent); color: var(--accent-ink); min-width: 110px; }
  #message {
    flex: 1; min-height: 96px; background: var(--panel); border-radius: var(--radius);
    display: flex; align-items: center; gap: 6px; padding: 8px 12px; overflow-x: auto; overflow-y: hidden;
    border: 3px solid transparent; box-shadow: 0 1px 0 var(--line), 0 2px 6px rgba(0,0,0,.05);
    scrollbar-width: none;
  }
  #message::-webkit-scrollbar { display: none; }
  #message.speaking { border-color: var(--accent); }
  #message .hint { color: var(--muted); font-size: 18px; white-space: nowrap; }
  .chip {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 64px; height: 76px; padding: 4px 8px; border-radius: 12px; background: var(--c-little);
    border: 2px solid rgba(0,0,0,.08);
  }
  .chip .sym { font-size: 34px; line-height: 1.05; }
  .chip img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
  .chip .lbl { font-size: 15px; font-weight: 600; white-space: nowrap; }

  /* ---------- Second row: quick phrases ---------- */
  #row2 { display: flex; gap: var(--gap); padding: 8px 10px; align-items: center; min-height: 64px; }
  #where {
    flex: 0 0 auto; font-weight: 700; font-size: 18px; padding: 0 12px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; gap: 6px; background: var(--c-folder);
  }
  #phrases { flex: 1; display: flex; gap: var(--gap); overflow-x: auto; scrollbar-width: none; }
  #phrases::-webkit-scrollbar { display: none; }
  .phrase {
    flex: 0 0 auto; height: 48px; padding: 0 16px; border: 0; border-radius: 24px; background: var(--panel);
    font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 0 var(--line);
  }
  .phrase .sym { font-size: 24px; }
  .phrase img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
  .phrase.add { border: 2px dashed var(--line); background: transparent; color: var(--muted); }
  .tool {
    flex: 0 0 auto; height: 48px; min-width: 48px; padding: 0 12px; border: 0; border-radius: 12px;
    background: var(--panel); font-size: 22px; box-shadow: 0 1px 0 var(--line); position: relative; overflow: hidden;
  }
  #gearBtn .fill {
    position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: rgba(31,138,156,.35);
    pointer-events: none;
  }
  #gearBtn.holding .fill { width: 100%; transition: width 1.5s linear; }
  #editBanner {
    display: none; align-items: center; gap: 12px; background: #FFF4CC; border-radius: 12px;
    padding: 0 12px; height: 52px; font-weight: 600; margin: 0 10px 8px;
  }
  body.editing #editBanner { display: flex; }
  #phrasesWrap { flex: 1; display: flex; min-width: 0; }
  body.no-phrases #phrasesWrap { visibility: hidden; }
  body.editing.no-phrases #phrasesWrap { visibility: visible; }
  #doneEdit { margin-left: auto; background: var(--accent); color: #fff; border: 0; border-radius: 10px; height: 36px; padding: 0 16px; font-weight: 700; }

  /* ---------- Board ---------- */
  #board { flex: 1; overflow-y: auto; padding: 0 10px 10px; -webkit-overflow-scrolling: touch; }
  #grid { display: grid; gap: var(--gap); min-height: 100%; }
  .tile {
    position: relative; border: 0; border-radius: var(--radius); padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--c-little); border: 2px solid rgba(0,0,0,.10);
    box-shadow: 0 2px 0 rgba(0,0,0,.10);
    container-type: size; min-height: 0; overflow: hidden;
    transition: transform .08s ease;
  }
  .tile:active, .tile.pressed { transform: scale(.94); }
  .tile.flash { outline: 4px solid var(--accent); outline-offset: -4px; }
  .tile .sym { font-size: 2.6rem; font-size: min(52cqh, 60cqw); line-height: 1.05; }
  .tile img { width: auto; height: 62%; max-width: 90%; object-fit: cover; border-radius: 10px; }
  .tile .lbl {
    font-size: var(--label-size); font-size: min(var(--label-size), 16cqw); font-weight: 700; line-height: 1.1; text-align: center;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
  }
  body.labels-top .tile { flex-direction: column-reverse; }
  body.no-labels .tile .lbl { display: none; }
  body.no-labels .tile .sym { font-size: min(70cqh, 70cqw); }
  body.no-labels .tile img { height: 85%; }
  .tile.folder { background: var(--c-folder); border-top-left-radius: 4px; }
  .tile.folder::before {
    content: ""; position: absolute; top: -2px; left: -2px; width: 42%; height: 12px;
    background: rgba(0,0,0,.12); border-bottom-right-radius: 10px;
  }
  .tile.folder .corner { position: absolute; right: 8px; top: 6px; font-size: 16px; opacity: .55; }
  .tile.ghost { visibility: hidden; }
  body.editing .tile.ghost { visibility: visible; opacity: .35; border-style: dashed; }
  body.editing .tile:not(.add) { animation: wiggle .5s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-.6deg); } to { transform: rotate(.6deg); } }
  .tile.add { background: transparent; border: 3px dashed var(--line); color: var(--muted); box-shadow: none; }
  .tile.add .sym { font-size: min(40cqh, 50cqw); }

  .c-people { background: var(--c-people); }
  .c-action { background: var(--c-action); }
  .c-describe { background: var(--c-describe); }
  .c-thing { background: var(--c-thing); }
  .c-social { background: var(--c-social); }
  .c-question { background: var(--c-question); }
  .c-no { background: var(--c-no); }
  .c-little { background: var(--c-little); }
  .c-folder { background: var(--c-folder); }

  /* ---------- Modals ---------- */
  .modal-back {
    position: fixed; inset: 0; background: rgba(20,28,40,.45); display: none; align-items: center; justify-content: center;
    z-index: 20; padding: 20px;
  }
  .modal-back.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: 22px; width: min(760px, 100%); max-height: 100%;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  .modal header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal header h2 { margin: 0; font-size: 22px; flex: 1; }
  .modal .body { padding: 16px 20px 24px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .modal footer { display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-size: 17px; background: #E7ECF2;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.danger { background: #FDE3E3; color: var(--danger); }
  .btn.small { padding: 8px 12px; font-size: 15px; }
  .tabs { display: flex; gap: 6px; padding: 10px 20px 0; flex-wrap: wrap; }
  .tabs button { border: 0; border-radius: 10px; padding: 10px 14px; background: #E7ECF2; font-weight: 600; font-size: 16px; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .field { margin: 0 0 16px; }
  .field > label, .field > .flabel { display: block; font-weight: 700; margin-bottom: 6px; }
  .field .help { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .field input[type=text], .field select {
    width: 100%; font-size: 18px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff;
  }
  .field input[type=range] { width: 100%; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EEF1F5; }
  .switch span { font-weight: 600; }
  .switch small { display: block; color: var(--muted); font-weight: 400; }
  .switch input { width: 28px; height: 28px; accent-color: var(--accent); flex: 0 0 auto; }
  .colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .colors button { border: 3px solid transparent; border-radius: 12px; padding: 8px 12px; font-size: 15px; font-weight: 600; }
  .colors button.on { border-color: var(--ink); }
  .preview-tile { width: 140px; height: 120px; pointer-events: none; animation: none !important; }
  .history { list-style: none; padding: 0; margin: 0; }
  .history li { padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
  .history time { color: var(--muted); font-size: 13px; display: block; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 8px 0 16px; }
  .legend div { padding: 8px 12px; border-radius: 10px; font-weight: 600; border: 1px solid rgba(0,0,0,.08); }
  .help-text h3 { margin: 18px 0 6px; }
  .help-text p, .help-text li { line-height: 1.45; }

  /* Big "show" screen so a listener can read the sentence in a noisy room */
  #show {
    position: fixed; inset: 0; background: #fff; z-index: 30; display: none; align-items: center; justify-content: center;
    padding: 40px; text-align: center; font-size: clamp(40px, 8vw, 110px); font-weight: 800; line-height: 1.15;
  }
  #show.open { display: flex; }
  #show small { position: absolute; bottom: 24px; left: 0; right: 0; font-size: 18px; font-weight: 500; color: var(--muted); }

  .micbadge { position: absolute; left: 6px; top: 4px; font-size: 16px; }
  .recorder { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .recorder .btn.rec { background: #FFE3E3; color: #B42318; }
  .recorder .btn.rec.on { background: #D92D20; color: #fff; animation: pulse 1s ease-in-out infinite; }
  .recorder .btn:disabled { opacity: .4; }
  .rec-status { color: var(--muted); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .7; } }
  .story { font-size: 22px; line-height: 1.6; background: #F6F8FB; border-radius: 14px; padding: 16px 18px; -webkit-user-select: text; user-select: text; }
  .session { text-align: center; }
  .session .big-sym { font-size: 96px; line-height: 1.1; }
  .session .big-sym img { width: 140px; height: 140px; object-fit: cover; border-radius: 18px; }
  .session .big-word { font-size: 40px; font-weight: 800; margin: 6px 0 4px; }
  .session .where-from { color: var(--muted); margin-bottom: 18px; }
  .session .recorder { justify-content: center; margin-bottom: 18px; }
  .progress { height: 10px; background: #E7ECF2; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
  .progress div { height: 100%; background: var(--accent); }
  .session .progress { height: 10px; background: #E7ECF2; border-radius: 6px; overflow: hidden; margin: 6px 0 18px; }
  .session .progress div { height: 100%; background: var(--accent); }
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: #1D2430; color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 600; z-index: 40;
    transition: all .25s ease; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 700px) {
    .navbtn, .barbtn { min-width: 58px; font-size: 12px; }
    #speakBtn { min-width: 70px; }
    #message { min-height: 80px; }
  }
</style>
</head>
<body>

<div id="top">
  <button class="navbtn" id="homeBtn" aria-label="Home"><span class="ico">🏠</span>Home</button>
  <button class="navbtn" id="backBtn" aria-label="Back"><span class="ico">⬅️</span>Back</button>
  <div id="message" role="button" aria-label="Message. Tap to speak."></div>
  <button class="barbtn" id="speakBtn" aria-label="Speak"><span class="ico">🔊</span>Speak</button>
  <button class="barbtn" id="delBtn" aria-label="Delete last word"><span class="ico">⌫</span>Delete</button>
  <button class="barbtn" id="clearBtn" aria-label="Clear"><span class="ico">🧹</span>Clear</button>
</div>

<div id="row2">
  <div id="where"></div>
  <div id="phrasesWrap"><div id="phrases"></div></div>
  <button class="tool" id="showBtn" aria-label="Show message in big letters">🔍</button>
  <button class="tool" id="gearBtn" aria-label="Grown-up settings (hold)"><span class="fill"></span>⚙️</button>
</div>

<div id="editBanner">✏️ Editing — tap any button or phrase to change it, or tap ➕ to add one. <button id="doneEdit">Done</button></div>
<div id="board"><div id="grid"></div></div>

<!-- Settings -->
<div class="modal-back" id="settingsModal">
  <div class="modal">
    <header><h2>Grown-up settings</h2><button class="btn" data-close>Close</button></header>
    <div class="tabs" id="settingsTabs"></div>
    <div class="body" id="settingsBody"></div>
  </div>
</div>

<!-- Button editor -->
<div class="modal-back" id="editorModal">
  <div class="modal">
    <header><h2 id="editorTitle">Edit button</h2></header>
    <div class="body" id="editorBody"></div>
    <footer id="editorFoot"></footer>
  </div>
</div>

<!-- Record many words one after another -->
<div class="modal-back" id="sessionModal">
  <div class="modal">
    <header><h2>🎙️ Record my voice</h2><button class="btn primary" id="sessionDone">Done</button></header>
    <div class="body session" id="sessionBody"></div>
  </div>
</div>

<!-- Copy my voice (AI) -->
<div class="modal-back" id="cloneModal">
  <div class="modal">
    <header><h2>🎙️ Copy my voice</h2><button class="btn" id="cloneClose">Close</button></header>
    <div class="body" id="cloneBody"></div>
  </div>
</div>

<div id="show"><div id="showText"></div><small>Tap anywhere to close</small></div>
<div id="toast"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* =========================================================
   Default vocabulary
   Core words stay in fixed places on the Home board so the
   child can learn them by position (motor planning).
   ========================================================= */
const COLORS = {
  people:   'People & pronouns',
  action:   'Actions / verbs',
  describe: 'Describing words',
  thing:    'Things / nouns',
  social:   'Social words',
  question: 'Questions',
  no:       'Stop / no / not',
  little:   'Little words',
  folder:   'Folder'
};

const w = (label, emoji, color, speak) => ({ type: 'word', label, emoji, color, ...(speak ? { speak } : {}) });
const f = (label, emoji, target) => ({ type: 'folder', label, emoji, color: 'folder', target });
const many = (color, list) => list.map(([label, emoji, speak]) => w(label, emoji, color, speak));

function defaultState() {
  const home = [
    w('I', '🙋', 'people'), w('want', '🤲', 'action'), w('more', '➕', 'little'), w('stop', '✋', 'no'),
    w('go', '🏃', 'action'), w('help', '🆘', 'action'), w('yes', '👍', 'social'), w('no', '👎', 'no'),

    w('you', '👉', 'people'), w('like', '❤️', 'action'), w('eat', '🍽️', 'action'), w('drink', '🥤', 'action'),
    w('play', '🧸', 'action'), w('open', '🔓', 'action'), w('all done', '🙌', 'social'), w('not', '🚫', 'no'),

    w('me', '🧒', 'people'), w('need', '☝️', 'action'), w('look', '👀', 'action'), w('feel', '💭', 'action'),
    w('have', '🫴', 'action'), w('do', '🛠️', 'action'), w('put', '📥', 'action'), w('get', '🫳', 'action'),

    w('it', '📦', 'little'), w('that', '👆', 'little'), w('big', '🐘', 'describe'), w('little', '🐭', 'describe'),
    w('good', '😀', 'describe'), w('bad', '😖', 'describe'), w('hot', '🔥', 'describe'), w('cold', '🧊', 'describe'),

    w('what', '❓', 'question'), w('where', '🗺️', 'question'), w('who', '👤', 'question'), w('mum', '👩', 'people'),
    w('dad', '👨', 'people'), w('here', '📍', 'little'), w('up', '⬆️', 'little'), w('down', '⬇️', 'little'),

    f('Food', '🍎', 'food'), f('Drinks', '🧃', 'drinks'), f('Feelings', '😊', 'feelings'), f('Play', '🎈', 'play'),
    f('Body', '🤕', 'body'), f('Places', '🏠', 'places'), f('People', '👨‍👩‍👧', 'people'), f('Animals', '🐶', 'animals'),

    f('Clothes', '👕', 'clothes'), f('Colours', '🌈', 'colours'), f('Chat', '👋', 'chat'), f('Time', '⏰', 'time'),
    f('Routines', '🪥', 'routines'), f('Numbers', '🔢', 'numbers'), f('Describe', '✨', 'describe'), f('My Things', '⭐', 'mythings')
  ];

  const boards = {
    home: { name: 'Home', buttons: home },
    food: { name: 'Food', buttons: many('thing', [
      ['apple','🍎'],['banana','🍌'],['grapes','🍇'],['strawberry','🍓'],['orange','🍊'],['watermelon','🍉'],['carrot','🥕'],['broccoli','🥦'],
      ['bread','🍞'],['toast','🍞'],['cheese','🧀'],['egg','🥚'],['chicken','🍗'],['rice','🍚'],['pasta','🍝'],['pizza','🍕'],
      ['sandwich','🥪'],['chips','🍟'],['burger','🍔'],['hot dog','🌭'],['soup','🍲'],['cereal','🥣'],['yoghurt','🥛'],['popcorn','🍿'],
      ['crackers','🥨'],['biscuit','🍪'],['cake','🍰'],['ice cream','🍦'],['sweets','🍬'],['chocolate','🍫'],['snack','🥨'],['yummy','😋']
    ]).map(b => b.label === 'yummy' ? { ...b, color: 'describe' } : b) },
    drinks: { name: 'Drinks', buttons: many('thing', [
      ['water','💧'],['milk','🥛'],['juice','🧃'],['smoothie','🥤'],['hot chocolate','☕'],['tea','🍵'],['cup','🥤'],['bottle','🍼'],
      ['straw','🥤'],['ice','🧊'],['thirsty','😛'],['more drink','➕','more drink, please']
    ]) },
    feelings: { name: 'Feelings', buttons: many('describe', [
      ['happy','😀'],['sad','😢'],['angry','😠'],['scared','😨'],['tired','😴'],['sick','🤒'],['hurt','🤕'],['excited','🤩'],
      ['silly','🤪'],['calm','😌'],['bored','😑'],['frustrated','😤'],['worried','😟'],['shy','😳'],['surprised','😮'],['loved','🥰'],
      ['hungry','😋'],['thirsty','😛'],['too loud','🙉','it is too loud'],['need a hug','🤗','I need a hug'],
      ['need quiet','🤫','I need some quiet'],['feel better','😊','I feel better'],['okay','👌'],['not okay','🙁','I am not okay']
    ]) },
    play: { name: 'Play', buttons: many('thing', [
      ['ball','⚽'],['blocks','🧱'],['puzzle','🧩'],['car','🚗'],['train','🚂'],['doll','🪆'],['teddy','🧸'],['bubbles','🫧'],
      ['music','🎵'],['drawing','🖍️'],['book','📖'],['tablet','📱'],['TV','📺'],['slide','🛝'],['swing','🌳'],['bike','🚲'],
      ['outside','🌳'],['game','🎲'],['dance','💃'],['sing','🎤'],['hide and seek','🙈'],['tickle','🤭'],['chase','🏃'],['balloon','🎈']
    ]) },

const STORE_KEY = 'talkboard-v1';

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.boards || !data.boards.home) return null;
    const def = defaultState();
    data.settings = { ...def.settings, ...(data.settings || {}) };
    data.phrases = data.phrases || def.phrases;
    data.history = data.history || [];
    return data;
  } catch (e) { return null; }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  } catch (e) {
    toast('Could not save. The iPad storage for this app is full — try using fewer or smaller photos.');
    return false;
  }
}

const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
function symbolNode(item) {
  if (item.image) return el('img', { src: item.image, alt: '' });
  return el('span', { class: 'sym', text: item.emoji || '' });
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function newId(base) {

let voices = [];
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices();
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.addEventListener ? speechSynthesis.addEventListener('voiceschanged', loadVoices) : (speechSynthesis.onvoiceschanged = loadVoices);
}

function say(text, onEnd) {
  if (!text) { if (onEnd) onEnd(); return; }
  if (!('speechSynthesis' in window)) { toast(text); if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const s = state.settings;
  const v = voices.find(v => v.voiceURI === s.voiceURI);
  if (v) { u.voice = v; u.lang = v.lang; }
  u.rate = s.rate; u.pitch = s.pitch; u.volume = s.volume;
  if (onEnd) {
    // iPad sometimes forgets to report the end of speech, so finish after a safe time anyway
    let done = false;
    const finish = () => { if (!done) { done = true; onEnd(); } };
    u.onend = finish; u.onerror = finish;
    setTimeout(finish, 1500 + text.length * 120 / s.rate);
  }
  speechSynthesis.speak(u);
}

function spokenText(item) { return item.speak || item.label; }

/* =========================================================
   Recorded voice
   Recordings are kept on this iPad (IndexedDB), keyed by the
   words they say — so recording “car” once covers every
   “car” button and phrase.
   ========================================================= */
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((resolve, reject) => {
    const r = indexedDB.open('talkboard', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('audio');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction('audio', mode);
      const req = fn(t.objectStore('audio'));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
    });
  };
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    keys: () => run('readonly', s => s.getAllKeys()),
    clear: () => run('readwrite', s => s.clear())
  };
})();

let recorded = new Set();       // keys that have a recording
const buffers = new Map();      // key -> decoded AudioBuffer
let audioCtx = null;
let currentSource = null;
let speakToken = 0;

function voiceKey(text) {
  return String(text || '').toLowerCase().replace(/[.,!?¿¡]+/g, '').replace(/\s+/g, ' ').trim();
}
// Which saved clip to play for some words: your own recording first, then the AI voice
function clipKey(text) {
  const k = voiceKey(text);
  if (!k) return null;
  if (state.settings.useRecordings && recorded.has(k)) return k;
  if (state.settings.useAIVoice && recorded.has('ai|' + k)) return 'ai|' + k;
  return null;
}
function personalCount() { return [...recorded].filter(k => !k.startsWith('ai|')).length; }

function getCtx() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Play through the speaker even if the iPad is on silent
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
// iPad only allows sound to start from a tap, so wake the audio up on the first touch
document.addEventListener('pointerdown', () => { try { getCtx(); } catch (e) {} }, { capture: true });

async function getBuffer(key) {
  if (buffers.has(key)) return buffers.get(key);
  const rec = await idb.get(key);
  if (!rec) return null;
  const buf = await getCtx().decodeAudioData(rec.data.slice(0));
  buffers.set(key, buf);
  return buf;
}

async function playClip(key) {
  let buf;
  try { buf = await getBuffer(key); } catch (e) { buf = null; }
  if (!buf) return;
  const ctx = getCtx();
  return new Promise(resolve => {
    const src = ctx.createBufferSource();
    const gain = ctx.createGain();
    gain.gain.value = state.settings.volume;
    src.buffer = buf;
    src.connect(gain).connect(ctx.destination);
    src.onended = resolve;
    currentSource = src;
    src.start();
    setTimeout(resolve, buf.duration * 1000 + 400);
  });
}

function stopSpeaking() {
  speakToken++;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (currentSource) { try { currentSource.stop(); } catch (e) {} currentSource = null; }
}

/* Speak a list of words: your recordings where you have them, the iPad voice for the rest.
   With whole: true, a sentence is said in one go by the AI voice when it can be. */
async function speakItems(items, onEnd, opts) {
  stopSpeaking();
  const token = speakToken;
  if (opts && opts.whole && items.length > 1) {
    const key = await aiSentenceClip(items.map(spokenText).join(' '));
    if (token !== speakToken) return;
    if (key) {
      await playClip(key);
      if (token === speakToken && onEnd) onEnd();
      return;
    }
  }
  const parts = [];
  for (const it of items) {
    const text = spokenText(it);
    const key = clipKey(text);
    if (key) parts.push({ key });
    else if (parts.length && parts[parts.length - 1].text != null) parts[parts.length - 1].text += ' ' + text;
    else parts.push({ text });
  }
  for (const p of parts) {
    if (token !== speakToken) return;
    if (p.key) await playClip(p.key);
    else await new Promise(r => say(p.text, r));
  }
  if (token === speakToken && onEnd) onEnd();
}

/* ---- Recording from the microphone ---- */
let micStream = null;
let mediaRec = null;

async function startMic() {
  if (!micStream || !micStream.active) {
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  }
  return micStream;
}
function releaseMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
}

async function startRecording() {
  const stream = await startMic();
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const chunks = [];
  mediaRec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  mediaRec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const finished = new Promise(resolve => { mediaRec.onstop = () => resolve(new Blob(chunks, { type: mediaRec.mimeType || type || 'audio/mp4' })); });
  mediaRec.start();
  return { finished };  // wrapped so callers can wait for the mic first, then for the recording
}
function stopRecording() { if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop(); }

/* Cut off the silence before and after the word, even out the loudness, and save it as a small WAV */
async function cleanRecording(blob) {
  const ctx = getCtx();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  const sr = buf.sampleRate;
  const mono = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < d.length; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  const win = Math.max(1, Math.round(sr * 0.01));
  const rms = [];
  for (let i = 0; i < mono.length; i += win) {
    let sum = 0;
    const end = Math.min(mono.length, i + win);
    for (let j = i; j < end; j++) sum += mono[j] * mono[j];
    rms.push(Math.sqrt(sum / (end - i)));
  }
  const loudest = Math.max(...rms, 0);
  if (loudest < 0.01) throw new Error('quiet');
  const thr = Math.max(0.012, loudest * 0.1);
  let first = rms.findIndex(v => v > thr);
  let last = rms.length - 1 - rms.slice().reverse().findIndex(v => v > thr);
  const start = Math.max(0, first * win - Math.round(sr * 0.05));
  const stop = Math.min(mono.length, (last + 1) * win + Math.round(sr * 0.12));
  const seg = mono.slice(start, stop);
  let peak = 0;
  for (const v of seg) peak = Math.max(peak, Math.abs(v));
  const gain = Math.min(8, 0.9 / (peak || 1));
  for (let i = 0; i < seg.length; i++) seg[i] *= gain;
  // gentle fade at both ends to avoid clicks
  const fade = Math.min(seg.length >> 1, Math.round(sr * 0.01));
  for (let i = 0; i < fade; i++) { seg[i] *= i / fade; seg[seg.length - 1 - i] *= i / fade; }

  return toWav(seg, sr, 22050);
}

async function toWav(samples, sr, outRate) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new OAC(1, Math.max(1, Math.ceil(samples.length * outRate / sr)), outRate);
  const src = off.createBufferSource();
  const b = off.createBuffer(1, samples.length, sr);
  b.getChannelData(0).set(samples);
  src.buffer = b;
  src.connect(off.destination);
  src.start();
  const out = await off.startRendering();
  return encodeWav(out.getChannelData(0), outRate);
}

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return { type: 'audio/wav', data: buf };
}

async function saveRecording(text, blob) {
  await storeClip(voiceKey(text), blob);
}

async function storeClip(key, blob) {
  let rec;
  try {
    rec = await cleanRecording(blob);
  } catch (e) {
    if (e.message === 'quiet') throw e;
    rec = { type: blob.type, data: await blob.arrayBuffer() };  // keep it as recorded if cleaning fails
  }
  await idb.set(key, rec);
  buffers.delete(key);
  recorded.add(key);
}

async function deleteRecording(text) {
  const key = voiceKey(text);
  await idb.del(key);
  buffers.delete(key);
  recorded.delete(key);
}

function micError(e) {
  if (e && e.message === 'quiet') return toast('I couldn’t hear anything. Hold the iPad closer and try again.');
  if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError'))
    return toast('The microphone is blocked. On the iPad: Settings → Apps → Safari → Microphone → Allow, then try again.');
  toast('Recording didn’t work on this device.');
}

/* =========================================================
   AI voice (ElevenLabs)
   A short reading sample is turned into a copy of your voice.
   Every word is then made once and saved on the iPad, so it
   still works offline. The key stays on this iPad only and is
   never put in backups.
   ========================================================= */
const AI_STORE = 'talkboard-ai';
const AI_API = 'https://api.elevenlabs.io/v1';
let ai = (() => { try { return JSON.parse(localStorage.getItem(AI_STORE)) || {}; } catch (e) { return {}; } })();
let aiVoices = null;   // voices on the ElevenLabs account, once loaded
let aiAccount = '';    // short account summary shown in settings
const gen = { running: false, stop: false, done: 0, total: 0, error: '' };

function saveAI() { try { localStorage.setItem(AI_STORE, JSON.stringify(ai)); } catch (e) {} }
function aiReady() { return !!(ai.key && ai.voiceId); }
function aiCount() { return voiceList().filter(x => recorded.has('ai|' + voiceKey(x.text))).length; }
function voicedCount() { return voiceList().filter(x => recorded.has(voiceKey(x.text)) || recorded.has('ai|' + voiceKey(x.text))).length; }

async function aiFetch(path, opts) {
  opts = opts || {};
  const r = await fetch(AI_API + path, { ...opts, headers: { 'xi-api-key': ai.key, ...(opts.headers || {}) } });
  if (!r.ok) {
    let msg = '';
    try {
      const j = await r.json();
      const d = j.detail;
      msg = typeof d === 'string' ? d : d && (d.message || (Array.isArray(d) && d.map(x => x.msg).join('; '))) || '';
    } catch (e) {}
    if (r.status === 401) msg = 'The ElevenLabs key was not accepted. ' + msg;
    const err = new Error(msg || `ElevenLabs returned error ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return r;
}

async function aiSpeech(text) {
  const r = await aiFetch(`/text-to-speech/${encodeURIComponent(ai.voiceId)}?output_format=mp3_44100_128`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'audio/mpeg' },
    body: JSON.stringify({
      text,
      model_id: 'eleven_multilingual_v2',
      voice_settings: { stability: 0.5, similarity_boost: 0.85, use_speaker_boost: true }
    })
  });
  return r.blob();
}

/* Make and save one word or phrase in the AI voice (skipped if it already exists) */
async function aiMakeClip(text) {
  const k = voiceKey(text);
  if (!k || !aiReady() || !navigator.onLine || recorded.has('ai|' + k)) return;
  await storeClip('ai|' + k, await aiSpeech(text));
}

/* A whole sentence in the AI voice: saved ones play offline, new ones are made when online */
async function aiSentenceClip(text) {
  const key = 'ai|' + voiceKey(text);
  if (!state.settings.useAIVoice) return null;
  if (recorded.has(key)) return key;
  if (!state.settings.aiSentences || !aiReady() || !navigator.onLine) return null;
  try {
    const blob = await Promise.race([aiSpeech(text), new Promise((_, no) => setTimeout(() => no(new Error('slow')), 6000))]);
    await storeClip(key, blob);
    return key;
  } catch (e) { return null; }
}

async function aiClearClips() {
  for (const k of [...recorded]) if (k.startsWith('ai|')) { await idb.del(k); recorded.delete(k); buffers.delete(k); }
}

async function playBlob(blob) {
  stopSpeaking();
  const buf = await getCtx().decodeAudioData(await blob.arrayBuffer());
  const src = getCtx().createBufferSource();
  src.buffer = buf;
  src.connect(getCtx().destination);
  currentSource = src;
  src.start();
}

function aiTodo() {
  return voiceList().filter(x => !recorded.has(voiceKey(x.text)) && !recorded.has('ai|' + voiceKey(x.text)));
}

async function aiMakeAll() {
  if (gen.running || !aiReady()) return;
  const todo = aiTodo();
  Object.assign(gen, { running: true, stop: false, done: 0, total: todo.length, error: '' });
  updateGen();
  let next = 0;
  const worker = async () => {
    while (!gen.stop && next < todo.length) {
      const item = todo[next++];
      for (let attempt = 1; ; attempt++) {
        try { await aiMakeClip(item.text); gen.done++; break; }
        catch (e) {
          if (e.status === 429 && attempt < 4) { await new Promise(r => setTimeout(r, 2000 * attempt)); continue; }
          gen.error = e.message; gen.stop = true; break;
        }
      }
      updateGen();
    }
  };
  await Promise.all([worker(), worker()]);
  gen.running = false;
  updateGen();
  if (!gen.error && !gen.stop) toast('All words are ready in your AI voice! 🎉');
}

function updateGen() {
  const box = document.getElementById('genStatus');
  if (!box) return;
  const total = voiceList().length;
  const ready = voicedCount();
  box.replaceChildren(...[
    el('div', { style: 'font-weight:700' },
      gen.running ? `Making words in your voice… ${gen.done} of ${gen.total}` : `${ready} of ${total} words are ready in your voice`),
    el('div', { class: 'progress' }, el('div', { style: `width:${gen.running ? (gen.total ? gen.done / gen.total * 100 : 0) : (total ? ready / total * 100 : 0)}%` })),
    gen.error ? el('div', { style: 'color:var(--danger); font-weight:600', text: 'Stopped: ' + gen.error }) : null,
    el('div', { class: 'row' },
      gen.running
        ? el('button', { class: 'btn danger', onclick: () => { gen.stop = true; } }, '⏹ Stop')
        : el('button', { class: 'btn primary', disabled: !aiReady() || !aiTodo().length, onclick: aiMakeAll }, aiTodo().length ? '✨ Make all words now' : '✅ All words made'),
      !gen.running && aiTodo().length ? el('span', { class: 'help', text: `Uses about ${aiTodo().reduce((n, x) => n + x.text.length, 0).toLocaleString()} characters of your ElevenLabs allowance.` }) : null)
  ].filter(Boolean));
}

async function aiCheck() {
  const box = document.getElementById('aiAccount');
  try {
    const sub = await (await aiFetch('/user/subscription')).json();
    const used = sub.character_count, limit = sub.character_limit;
    aiAccount = `✅ Connected — ${sub.tier || 'your'} plan` + (limit ? `, ${Number(used).toLocaleString()} of ${Number(limit).toLocaleString()} characters used this month` : '');
    const v = await (await aiFetch('/voices')).json();
    aiVoices = (v.voices || []).map(x => ({ id: x.voice_id, name: x.name, category: x.category }));
  } catch (e) {
    aiAccount = '❌ ' + e.message;
    aiVoices = null;
  }
  if (box) box.textContent = aiAccount;
  if (settingsTab === 'ai' && $('#settingsModal').classList.contains('open')) renderSettings();
}

/* ---- Recording a reading sample to copy the voice ---- */
const CLONE_STORY = 'Good morning, sweetheart! Did you sleep well? Let’s get up and have some breakfast. ' +
  'Do you want toast or cereal today? Here is your cup of milk. Careful, it’s a little bit hot. ' +
  'Wow, you finished it all. Well done! Now let’s brush our teeth and get dressed. ' +
  'Which shirt do you like, the blue one or the red one? Great choice. ' +
  'After that we can go outside and play. I can see a big dog in the park, and a little bird up in the tree. ' +
  'Can you hear it singing? It’s nearly time for lunch. Are you hungry? I’m hungry too. ' +
  'Let’s wash our hands first. Oh no, I dropped my spoon! That’s so silly. ' +
  'Do you need some help? Just tell me, and I will help you. ' +
  'If something hurts, or you feel sad, angry, tired or scared, you can tell me too. ' +
  'I love you very much. Shall we read a book together before bed? One more page, and then it’s time to sleep. ' +
  'Good night, my darling. See you in the morning.';

const clone = { blob: null, secs: 0, recording: false, busy: false, consent: false, name: 'My voice', timer: null, status: '' };

function openClone() {
  Object.assign(clone, { blob: null, secs: 0, recording: false, busy: false, status: '' });
  renderClone();
  $('#cloneModal').classList.add('open');
}

function fmtSecs(n) { return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }

function renderClone() {
  const ready = clone.blob && clone.secs >= 30 && clone.consent && !clone.busy;
  $('#cloneBody').replaceChildren(...[
    el('p', { text: 'Find a quiet room. Tap Start, then read the story below out loud in your normal, warm voice — the way you talk to your child. About 1 minute is enough; 2 minutes is even better.' }),
    el('div', { class: 'story', text: CLONE_STORY }),
    el('div', { class: 'recorder', style: 'margin:16px 0' }, ...[
      clone.recording
        ? el('button', { class: 'btn rec on', onclick: cloneStop }, `⏹ Stop (${fmtSecs(clone.secs)})`)
        : el('button', { class: 'btn rec', disabled: clone.busy, onclick: cloneStart }, clone.blob ? '🎙️ Record again' : '🎙️ Start reading'),
      clone.blob && !clone.recording ? el('button', { class: 'btn', onclick: () => playBlob(clone.blob).catch(() => toast('Could not play the sample.')) }, '▶️ Listen') : null,
      el('span', { class: 'rec-status', text:
        clone.recording ? (clone.secs < 30 ? 'Keep reading…' : clone.secs < 60 ? 'Good — a little more is even better' : 'Great! Tap Stop whenever you like') :
        clone.blob ? (clone.secs < 30 ? `Only ${clone.secs} seconds — please record at least 30 seconds` : `Recorded ${fmtSecs(clone.secs)}`) : '' })
    ].filter(Boolean)),
    el('div', { class: 'field' }, el('label', { text: 'Name for this voice' }),
      el('input', { type: 'text', value: clone.name, oninput: e => { clone.name = e.target.value; } })),
    el('label', { class: 'switch' },
      el('span', {}, 'This is my own voice', el('small', { text: 'ElevenLabs only allows copying a voice with the speaker’s permission.' })),
      el('input', { type: 'checkbox', checked: clone.consent, onchange: e => { clone.consent = e.target.checked; renderClone(); } })),
    el('div', { class: 'row', style: 'margin-top:16px' },
      el('button', { class: 'btn primary', disabled: !ready, onclick: cloneCreate }, clone.busy ? 'Creating…' : '✨ Create my AI voice'),
      clone.status ? el('span', { class: 'rec-status', text: clone.status }) : null)
  ].filter(Boolean));
}

async function cloneStart() {
  stopSpeaking();
  let session;
  try { session = await startRecording(); } catch (e) { return micError(e); }
  Object.assign(clone, { recording: true, secs: 0, blob: null });
  renderClone();
  clone.timer = setInterval(() => { clone.secs++; if (clone.secs >= 180) cloneStop(); else renderClone(); }, 1000);
  session.finished.then(blob => { clone.blob = blob; clone.recording = false; renderClone(); });
}
function cloneStop() { clearInterval(clone.timer); stopRecording(); }

async function cloneCreate() {
  clone.busy = true; clone.status = 'Sending your sample to ElevenLabs…'; renderClone();
  try {
    let file;
    try {
      const buf = await getCtx().decodeAudioData(await clone.blob.arrayBuffer());
      const mono = new Float32Array(buf.length);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const d = buf.getChannelData(c);
        for (let i = 0; i < d.length; i++) mono[i] += d[i] / buf.numberOfChannels;
      }
      const wav = await toWav(mono, buf.sampleRate, 24000);
      file = new File([wav.data], 'sample.wav', { type: 'audio/wav' });
    } catch (e) {
      file = new File([clone.blob], 'sample.m4a', { type: clone.blob.type || 'audio/mp4' });
    }
    const form = new FormData();
    form.append('name', (clone.name || 'My voice').trim() + ' (Talk Board)');
    form.append('files', file);
    form.append('description', 'Voice for Talk Board');
    const res = await (await aiFetch('/voices/add', { method: 'POST', body: form })).json();
    await aiClearClips();
    ai.voiceId = res.voice_id;
    ai.voiceName = (clone.name || 'My voice').trim();
    saveAI();
    aiVoices = null;
    closeModal('#cloneModal');
    settingsTab = 'ai';
    openSettings();
    aiCheck();
    if (res.requires_verification) alert('ElevenLabs wants you to verify this voice on their website (elevenlabs.io → Voices) before it can be used.');
    else if (confirm('Your AI voice is ready! Make all the words in your voice now?')) aiMakeAll();
  } catch (e) {
    clone.status = '❌ ' + e.message;
  }
  clone.busy = false;
  if ($('#cloneModal').classList.contains('open')) renderClone();
}

/* A Record / Play / Remove control for one word or phrase.
   getText() returns what the button says, so the right recording is used. */
function recorderWidget(getText, onChange) {
  const box = el('div', { class: 'recorder' });
  let state_ = 'idle';
  let timer = null;
  let secs = 0;

  const draw = () => {
    const text = getText();
    const has = recorded.has(voiceKey(text));
    box.replaceChildren(...[
      state_ === 'recording'
        ? el('button', { class: 'btn rec on', onclick: stop }, `⏹ Stop (${secs}s)`)
        : el('button', { class: 'btn rec', disabled: state_ === 'busy' || !text.trim(), onclick: start }, has ? '🎙️ Record again' : '🎙️ Record my voice'),
      has && state_ === 'idle' ? el('button', { class: 'btn', onclick: () => speakItems([{ label: text }]) }, '▶️ Play') : null,
      has && state_ === 'idle' ? el('button', { class: 'btn danger small', onclick: remove }, 'Remove') : null,
      el('span', { class: 'rec-status', text:
        state_ === 'recording' ? 'Say “' + text + '” now…' :
        state_ === 'busy' ? 'Saving…' :
        has ? '✅ Uses your voice' : 'Uses the iPad voice' })
    ].filter(Boolean));
  };
  async function start() {
    stopSpeaking();
    let session;
    try { session = await startRecording(); } catch (e) { return micError(e); }
    state_ = 'recording'; secs = 0; draw();
    timer = setInterval(() => { secs++; if (secs >= 8) stop(); else draw(); }, 1000);
    session.finished.then(async blob => {
      state_ = 'busy'; draw();
      try {
        await saveRecording(getText(), blob);
        state_ = 'idle'; draw();
        if (onChange) onChange();
        speakItems([{ label: getText() }]);
      } catch (e) { state_ = 'idle'; draw(); micError(e); }
    }).catch(e => { state_ = 'idle'; draw(); micError(e); });
  }
  function stop() { clearInterval(timer); stopRecording(); }
  async function remove() {
    await deleteRecording(getText());
    draw();
    if (onChange) onChange();
  }
  box.refresh = () => { if (state_ === 'idle') draw(); };
  draw();
  return box;
}

function applySettings() {
  const s = state.settings;
  document.body.classList.toggle('labels-top', s.labelPos === 'top');
  document.body.classList.toggle('no-labels', !s.showLabels);
  document.body.classList.toggle('no-phrases', !s.showPhrases);

}

function renderMessage() {
  const m = $('#message');
  m.replaceChildren();
  if (!message.length) {
    m.append(el('span', { class: 'hint', text: editing ? 'Editing mode' : 'Tap pictures to build a message…' }));
    return;
  }
  for (const item of message) {
    m.append(el('div', { class: 'chip c-' + (item.color || 'little') }, symbolNode(item), el('span', { class: 'lbl', text: item.label })));
  }
  m.scrollLeft = m.scrollWidth;
}

function renderRow2() {
  const id = currentBoardId();
  const b = state.boards[id];
  $('#where').replaceChildren(id === 'home' ? '🏠 Home' : '📂 ' + (b ? b.name : ''));
  $('#backBtn').disabled = nav.length <= 1;
  $('#homeBtn').disabled = id === 'home';

  const p = $('#phrases');
  p.replaceChildren();
  state.phrases.forEach((ph, i) => {
    p.append(el('button', { class: 'phrase', 'data-i': i }, symbolNode(ph), el('span', { text: ph.label })));
  });
  if (editing) p.append(el('button', { class: 'phrase add', onclick: () => openEditor({ kind: 'phrase', index: -1 }) }, '➕ Add phrase'));
}

function boardRows(count) {
  const cols = state.settings.cols;
  const homeCount = state.boards.home.buttons.length;
  return Math.max(Math.ceil(count / cols), Math.ceil(homeCount / cols), 1);
}

function renderBoard() {
  const id = currentBoardId();
  const b = state.boards[id];
  const grid = $('#grid');
  grid.replaceChildren();
  if (!b) { nav = ['home']; return renderAll(); }

  const cols = state.settings.cols;
  const count = b.buttons.length + (editing ? 1 : 0);
  const rows = boardRows(count);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${rows}, minmax(84px, 1fr))`;

  b.buttons.forEach((item, i) => {
    const cls = ['tile', 'c-' + (item.color || 'little')];
    if (item.type === 'folder') cls.push('folder');
    if (item.hidden) cls.push('ghost');
    grid.append(el('button', { class: cls.join(' '), 'data-i': i, 'aria-label': item.label },
      symbolNode(item),
      el('span', { class: 'lbl', text: item.label }),
      item.type === 'folder' ? el('span', { class: 'corner', text: '▸' }) : null,
      editing && recorded.has(voiceKey(spokenText(item))) ? el('span', { class: 'micbadge', text: '🎙️' }) : null
    ));
  });

  if (editing) {
    grid.append(el('button', { class: 'tile add', 'data-add': '1', 'aria-label': 'Add a button' },
      el('span', { class: 'sym', text: '➕' }), el('span', { class: 'lbl', text: 'Add' })));
  } else if (!b.buttons.length) {
    grid.append(el('div', { style: `grid-column: 1 / -1; align-self: center; text-align:center; color: var(--muted); font-size: 20px;` },
      'This folder is empty. A grown-up can add photos here: hold ⚙️ → Edit buttons.'));
  }
}

function renderAll() {
  applySettings();
  renderMessage();
  renderRow2();
  renderBoard();
}

/* =========================================================
   Child actions
   ========================================================= */
function guard() {
  const now = Date.now();
  if (now - lastTap < state.settings.tapGuard) return false;
  lastTap = now;
  return true;
}

function flash(node) {
  if (!node) return;
  node.classList.add('flash');
  setTimeout(() => node.classList.remove('flash'), 350);
}

function openBoard(id) {
  if (!state.boards[id]) return;
  nav.push(id);
  renderRow2();
  renderBoard();
  $('#board').scrollTop = 0;
}

function goHome() { nav = ['home']; renderRow2(); renderBoard(); }

function pressTile(i, node) {
  const id = currentBoardId();
  const item = state.boards[id].buttons[i];
  if (!item) return;
  if (editing) return openEditor({ kind: 'button', boardId: id, index: i });
  if (item.hidden) return;
  if (!guard()) return;
  flash(node);

  if (item.type === 'folder') {
    if (state.settings.speakFolders) speakItems([item]);
    return openBoard(item.target);
  }

  message.push({ label: item.label, speak: item.speak, emoji: item.emoji, image: item.image, color: item.color });
  renderMessage();
  if (state.settings.speakOnTap) speakItems([item]);
  if (id !== 'home' && state.settings.goHomeAfterFolder) setTimeout(goHome, 150);
}

function speakMessage() {
  if (!message.length) return;
  const text = message.map(spokenText).join(' ');
  const bar = $('#message');
  bar.classList.add('speaking');
  speakItems(message.slice(), () => bar.classList.remove('speaking'), { whole: true });
  setTimeout(() => bar.classList.remove('speaking'), Math.max(1500, text.length * 90));
  logHistory(text);
  if (state.settings.clearAfterSpeak) { message = []; setTimeout(renderMessage, 600); }
}

function logHistory(text) {
  state.history.unshift({ t: Date.now(), text });
  state.history = state.history.slice(0, 200);
  save();
}

$('#grid').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (!t) return;
  if (t.dataset.add) return openEditor({ kind: 'button', boardId: currentBoardId(), index: -1 });
  pressTile(+t.dataset.i, t);
});

$('#phrases').addEventListener('click', e => {
  const t = e.target.closest('.phrase');
  if (!t) return;
  const ph = state.phrases[+t.dataset.i];
  if (editing) return openEditor({ kind: 'phrase', index: +t.dataset.i });
  if (!guard()) return;
  flash(t);
  speakItems([ph]);
  logHistory(ph.speak || ph.label);
});

$('#message').addEventListener('click', speakMessage);
$('#speakBtn').addEventListener('click', speakMessage);
$('#delBtn').addEventListener('click', () => { message.pop(); renderMessage(); });
$('#clearBtn').addEventListener('click', () => { message = []; renderMessage(); stopSpeaking(); });
$('#homeBtn').addEventListener('click', goHome);
$('#backBtn').addEventListener('click', () => { if (nav.length > 1) { nav.pop(); renderRow2(); renderBoard(); } });

$('#showBtn').addEventListener('click', () => {
  const text = message.map(m => m.label).join(' ');
  if (!text) return toast('Build a message first, then tap 🔍 to show it big.');
  $('#showText').textContent = text;
  $('#show').classList.add('open');
});
$('#show').addEventListener('click', () => $('#show').classList.remove('open'));

/* Grown-up lock: hold the gear for 1.5 seconds */
(() => {
  const g = $('#gearBtn');
  let timer = null;
  const start = e => {
    e.preventDefault();
    g.classList.add('holding');
    timer = setTimeout(() => { cancel(); openSettings(); }, 1500);
  };
  const cancel = () => {
    if (timer) clearTimeout(timer);
    timer = null;
    g.classList.remove('holding');
  };
  g.addEventListener('pointerdown', start);
  g.addEventListener('pointerup', () => { if (timer) toast('Grown-ups: press and hold ⚙️ to open settings.'); cancel(); });
  g.addEventListener('pointerleave', cancel);
  g.addEventListener('pointercancel', cancel);
  g.addEventListener('contextmenu', e => e.preventDefault());
})();

$('#doneEdit').addEventListener('click', () => setEditing(false));

function setEditing(on) {
  editing = on;
  renderAll();
  if (on) toast('Editing on. Tap any button to change it.');
}

let settingsTab = 'voice';
const TABS = [
  ['voice', '🗣️ Voice'],
  ['ai', '🤖 AI voice'],
  ['speaking', '💬 Speaking'],
  ['display', '🖼️ Display'],
  ['edit', '✏️ Edit'],
  ['history', '🕘 What was said'],
  ['backup', '💾 Backup'],
  ['help', '❓ Help']
];

function openSettings() {
  loadVoices();
  renderSettings();
  $('#settingsModal').classList.add('open');
}
function closeModal(id) {
  $(id).classList.remove('open');
  if (id === '#editorModal' || id === '#sessionModal' || id === '#cloneModal') { stopRecording(); releaseMic(); }
}
$('#settingsModal [data-close]').addEventListener('click', () => closeModal('#settingsModal'));

function setSetting(key, value) {
  state.settings[key] = value;
  save();
  renderAll();
}

function toggleRow(key, title, sub) {
  return el('label', { class: 'switch' },
    el('span', {}, title, sub ? el('small', { text: sub }) : null),
    el('input', { type: 'checkbox', checked: !!state.settings[key], onchange: e => setSetting(key, e.target.checked) }));
}

function rangeField(key, title, min, max, step, fmt) {
  const out = el('span', { text: fmt(state.settings[key]) });
  return el('div', { class: 'field' },
    el('div', { class: 'flabel' }, title, ': ', out),
    el('input', { type: 'range', min, max, step, value: state.settings[key],
      oninput: e => { out.textContent = fmt(+e.target.value); state.settings[key] = +e.target.value; },
      onchange: () => { save(); renderAll(); } }));
}

function renderSettings() {
  const tabs = $('#settingsTabs');
  tabs.replaceChildren(...TABS.map(([id, name]) =>
    el('button', { class: id === settingsTab ? 'on' : '', onclick: () => { settingsTab = id; renderSettings(); } }, name)));
  const body = $('#settingsBody');
  body.replaceChildren();
  const s = state.settings;

  if (settingsTab === 'voice') {
    const sorted = voices.slice().sort((a, b) => {
      const pref = navigator.language.slice(0, 2);
      const pa = a.lang.startsWith(pref) ? 0 : 1, pb = b.lang.startsWith(pref) ? 0 : 1;
      return pa - pb || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name);
    });
    const sel = el('select', { onchange: e => setSetting('voiceURI', e.target.value) },
      el('option', { value: '', text: 'iPad default voice' }),
      sorted.map(v => el('option', { value: v.voiceURI, selected: v.voiceURI === s.voiceURI, text: `${v.name} (${v.lang})` })));
    body.append(
      el('div', { class: 'field' }, el('label', { text: 'Voice' }), sel,
        el('div', { class: 'help', text: 'Tip: choose a child or young-sounding voice if you can. You can download nicer voices on the iPad in Settings → Accessibility → Spoken Content → Voices.' })),
      rangeField('rate', 'Speed', 0.5, 1.5, 0.05, v => v.toFixed(2) + '×'),
      rangeField('pitch', 'Pitch', 0.5, 2, 0.05, v => v.toFixed(2)),
      rangeField('volume', 'Volume', 0.2, 1, 0.05, v => Math.round(v * 100) + '%'),
      el('button', { class: 'btn primary', onclick: () => say('Hello! I can talk with my pictures.') }, '▶️ Test the iPad voice'),
      el('hr', { style: 'margin:24px 0;border:0;border-top:1px solid var(--line)' }),
      el('h3', { style: 'margin:0 0 6px', text: '🎙️ Your own voice' }),
      el('p', { class: 'help', text: `You have recorded ${personalCount()} of ${voiceList().length} words and phrases. Recorded words play in your real voice. Don’t want to record them all? Use the 🤖 AI voice tab to copy your voice from a short sample.` }),
      toggleRow('useRecordings', 'Use my recordings'),
      el('div', { class: 'row', style: 'margin-top:12px' },
        el('button', { class: 'btn primary', onclick: () => { closeModal('#settingsModal'); openSession(); } }, '🎙️ Record my voice for many words'),
        personalCount() ? el('button', { class: 'btn danger', onclick: async () => {
          if (!confirm('Delete all your voice recordings?')) return;
          for (const k of [...recorded]) if (!k.startsWith('ai|')) { await idb.del(k); recorded.delete(k); buffers.delete(k); }
          renderSettings(); toast('Recordings deleted.');
        } }, 'Delete all recordings') : null),
      el('p', { class: 'help', text: 'You can also record one button at a time: Edit → tap the button → Record my voice.' })
    );
  }

  if (settingsTab === 'ai') {
    const keyInput = el('input', { type: 'password', value: ai.key || '', placeholder: 'Paste your ElevenLabs API key', autocomplete: 'off', style: 'flex:1; min-width:220px' });
    const voiceOptions = (aiVoices || []).slice();
    if (ai.voiceId && !voiceOptions.some(v => v.id === ai.voiceId)) voiceOptions.unshift({ id: ai.voiceId, name: ai.voiceName || 'My voice' });
    const genBox = el('div', { id: 'genStatus', style: 'margin-bottom:8px' });
    body.append(...[

function bufToB64(buf) {
  const bytes = new Uint8Array(buf);
  let out = '';
  for (let i = 0; i < bytes.length; i += 0x8000) out += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(out);
}
function b64ToBuf(b64) {
  const str = atob(b64);
  const bytes = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}

async function exportBackup() {
  const recordings = {};
  for (const k of await idb.keys()) {
    const rec = await idb.get(k);
    if (rec) recordings[k] = { type: rec.type, data: bufToB64(rec.data) };
  }
  const blob = new Blob([JSON.stringify({ ...state, recordings })], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: `talkboard-backup-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

$('#importInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.boards || !data.boards.home) throw new Error('bad');
    if (!confirm('Replace everything on this iPad with this backup?')) return;
    const def = defaultState();
    data.settings = { ...def.settings, ...(data.settings || {}) };
    data.phrases = data.phrases || def.phrases;
    data.history = data.history || [];
    if (data.recordings) {
      await idb.clear(); buffers.clear(); recorded.clear();
      for (const [k, rec] of Object.entries(data.recordings)) {
        await idb.set(k, { type: rec.type, data: b64ToBuf(rec.data) });
        recorded.add(k);
      }
    }
    delete data.recordings;
    state = data; nav = ['home']; message = [];
    save(); renderAll(); renderSettings();
    toast('Backup loaded.');
  } catch (err) {
    toast('That file is not a Talk Board backup.');
  }
});

/* =========================================================
   Record many words one after another
   ========================================================= */
const session = { list: [], i: 0, onlyMissing: true };

function voiceList() {
  const seen = new Set();
  const list = [];
  const add = (item, from) => {
    const text = spokenText(item);
    const k = voiceKey(text);
    if (!k || seen.has(k)) return;
    seen.add(k);
    list.push({ text, item, from });
  };
  const visited = new Set();
  const addBoard = id => {
    if (visited.has(id) || !state.boards[id]) return;
    visited.add(id);
    for (const b of state.boards[id].buttons) if (b.type !== 'folder') add(b, state.boards[id].name);
  };
  addBoard('home');
  state.phrases.forEach(p => add(p, 'Quick phrases'));
  state.boards.home.buttons.forEach(b => b.type === 'folder' && addBoard(b.target));
  Object.keys(state.boards).forEach(addBoard);
  return list;
}

function sessionStep(from, dir) {
  const n = session.list.length;
  for (let j = from; j >= 0 && j < n; j += dir) {
    if (!session.onlyMissing || !recorded.has(voiceKey(session.list[j].text))) return j;
  }
  return -1;
}

function openSession() {
  session.list = voiceList();
  session.i = Math.max(0, sessionStep(0, 1));
  renderSession();
  $('#sessionModal').classList.add('open');
}

function renderSession() {
  const body = $('#sessionBody');
  const total = session.list.length;
  const doneCount = session.list.filter(x => recorded.has(voiceKey(x.text))).length;
  const cur = session.list[session.i];
  const allDone = session.onlyMissing && sessionStep(0, 1) < 0;

  const next = () => {
    const j = sessionStep(session.i + 1, 1);
    if (j < 0) { if (session.onlyMissing && sessionStep(0, 1) < 0) return renderSession(); return toast('That was the last one.'); }
    session.i = j; renderSession();
  };

  body.replaceChildren(...[
    el('div', { style: 'text-align:left; font-weight:600' }, `${doneCount} of ${total} recorded`),
    el('div', { class: 'progress' }, el('div', { style: `width:${total ? doneCount / total * 100 : 0}%` })),
    allDone || !cur
      ? el('div', {}, el('div', { class: 'big-sym', text: '🎉' }), el('div', { class: 'big-word', text: 'All recorded!' }),
          el('p', { text: 'Every word and phrase now uses your voice.' }))
      : el('div', {},
          el('div', { class: 'big-sym' }, symbolNode(cur.item)),
          el('div', { class: 'big-word', text: cur.text }),
          el('div', { class: 'where-from', text: 'from ' + cur.from }),
          recorderWidget(() => cur.text, () => setTimeout(renderSessionProgress, 0)),
          el('div', { class: 'row', style: 'justify-content:center' },
            el('button', { class: 'btn', onclick: () => { session.i = Math.max(0, session.i - 1); renderSession(); } }, '⏮ Previous'),
            el('button', { class: 'btn primary', onclick: next }, 'Next ⏭'))),
    el('label', { class: 'switch', style: 'margin-top:18px; text-align:left' },
      el('span', {}, 'Only show words I haven’t recorded yet'),
      el('input', { type: 'checkbox', checked: session.onlyMissing, onchange: e => {
        session.onlyMissing = e.target.checked;
        if (session.onlyMissing) session.i = Math.max(0, sessionStep(session.i, 1) < 0 ? sessionStep(0, 1) : sessionStep(session.i, 1));
        renderSession();
      } })),
    el('p', { class: 'help', style: 'text-align:left', text: 'Tip: find a quiet room, hold the iPad about a hand’s length away, and say each word the way you’d like your child to hear it.' })
  ].filter(Boolean));
}

function renderSessionProgress() {
  const total = session.list.length;
  const doneCount = session.list.filter(x => recorded.has(voiceKey(x.text))).length;
  const body = $('#sessionBody');
  body.firstChild.textContent = `${doneCount} of ${total} recorded`;
  body.querySelector('.progress div').style.width = (total ? doneCount / total * 100 : 0) + '%';
}

function listFor(t) { return t.kind === 'phrase' ? state.phrases : state.boards[t.boardId].buttons; }

function saveItem() {
  if (!draft.label.trim()) return toast('Please type a word for the button.');
  draft.label = draft.label.trim();
  if (target.kind === 'button' && draft.type === 'folder' && (!draft.target || !state.boards[draft.target])) {
    draft.target = newId(draft.label);
    state.boards[draft.target] = { name: draft.label, buttons: [] };
  }
  if (target.kind === 'button' && draft.type === 'folder' && state.boards[draft.target]) {
    state.boards[draft.target].name = draft.label;
  }
  if (target.kind === 'button' && draft.type !== 'folder') delete draft.target;
  const list = listFor(target);
  if (target.index < 0) list.push(draft); else list[target.index] = draft;
  if (save()) {
    closeModal('#editorModal');
    renderAll();
    if (draft.type !== 'folder') aiMakeClip(spokenText(draft)).catch(() => {});
  }
}

function moveItem(dir) {
  const list = listFor(target);
  const j = target.index + dir;
  if (j < 0 || j >= list.length) return;
  [list[target.index], list[j]] = [list[j], list[target.index]];
  target.index = j;
  save();
  renderAll();
  toast(dir < 0 ? 'Moved earlier' : 'Moved later');
}

function deleteItem() {
  const list = listFor(target);
  const item = list[target.index];
  const extra = item.type === 'folder' ? ' Everything inside this folder will be removed too.' : '';
  if (!confirm(`Delete “${item.label}”?${extra}`)) return;
  list.splice(target.index, 1);
  if (item.type === 'folder' && item.target && item.target !== 'home') {
    const stillUsed = Object.values(state.boards).some(b => b.buttons.some(x => x.target === item.target));
    if (!stillUsed) delete state.boards[item.target];
  }
  save();
  closeModal('#editorModal');
  renderAll();
}

function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

/* Stop iPad double-tap zoom and pinch on the board */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* Offline support when served over https */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderAll();
idb.keys().then(keys => { recorded = new Set(keys); renderAll(); }).catch(() => {});
})();
</script>
